name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-tests:
    name: lint-and-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: 安裝測試與代碼品質工具
        run: python -m pip install pytest ruff functions-framework
      - name: Ruff 語法與品質檢查（ruff check .）
        run: ruff check .
      - name: Pytest 技能單元測試（pytest -q）
        run: python -m pytest -q
      - name: Study Notes 技能單元測試
        run: python -m unittest discover -s .claude/skills/study-notes/scripts/tests -v
